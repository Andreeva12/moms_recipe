[pytest]
markers =
    smoke: Быстрая проверка основных сценариев
    regression: Полный регресс
    api: Тесты API
    mobile: Тесты мобильного приложения
    ui: UI тесты
    critical: Критические сценарии (для smoke)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    --html=reports/report.html
    --self-contained-html

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S